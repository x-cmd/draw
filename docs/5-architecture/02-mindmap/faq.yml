id: x-draw-5-architecture-02-mindmap

data:
  - name:
      en: Mind map
      cn: 思维导图
    qa:
      - id: how-to-write
        question:
          en: "How do I write the tree?"
          cn: "树怎么写?"
        answer:
          en: >
            One `n=` per leaf, slash-separated: `Launch/Eng/Tests`. Paths that share a prefix share a parent — the parents are inferred, you never write them.
          cn: >
            每个叶子一条 `n=`,用斜杠分层:`Launch/Eng/Tests`。有公共前缀的路径就是同一个父节点,父节点由引擎推断,不用你写。
        confidence: 9
        reference:
          - docs/5-architecture/02-mindmap/en.md
          - docs/5-architecture/02-mindmap/cn.md
  - name:
      en: Style
      cn: 形态
    qa:
      - id: style-vs-theme
        question:
          en: "What is the difference between `style=` and `t=`?"
          cn: "`style=` 和 `t=` 有什么区别?"
        answer:
          en: >
            `style=` picks the shape — organic, tree, radial or bubble. `t=` picks the colours. Setting `t=` never changes the layout.
          cn: >
            `style=` 定形态 —— organic、tree、radial、bubble;`t=` 定颜色。改 `t=` 不会动布局。
        confidence: 9
        reference:
          - docs/5-architecture/02-mindmap/en.md
          - docs/5-architecture/02-mindmap/cn.md
