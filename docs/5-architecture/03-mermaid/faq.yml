id: x-draw-5-architecture-03-mermaid

data:
  - name:
      en: Flowchart
      cn: 流程图
    qa:
      - id: how-to-write
        question:
          en: "Do I need Mermaid installed?"
          cn: "要自己装 Mermaid 吗?"
        answer:
          en: >
            No — you only write the syntax into `m=`. The service renders it and hands back an SVG, so there is no browser and no screenshot step.
          cn: >
            不用 —— 你只把语法写进 `m=`。服务端渲染好直接给你 SVG,没有浏览器、也没有截图这一步。
        confidence: 9
        reference:
          - docs/5-architecture/03-mermaid/en.md
          - docs/5-architecture/03-mermaid/cn.md
  - name:
      en: Supported syntax
      cn: 支持的语法
    qa:
      - id: subset
        question:
          en: "Is all of Mermaid supported?"
          cn: "Mermaid 全都支持吗?"
        answer:
          en: >
            No — only the flowchart subset: `graph` / `flowchart` with node shapes, edge styles and labels, and subgraphs. A `sequenceDiagram` or a `pieChart` is a 400.
          cn: >
            不全 —— 只支持流程图这一部分:`graph` / `flowchart`,带节点形状、连线样式和文字,以及 subgraph。`sequenceDiagram`、`pieChart` 这些会 400。
        confidence: 9
        reference:
          - docs/5-architecture/03-mermaid/en.md
          - docs/5-architecture/03-mermaid/cn.md
