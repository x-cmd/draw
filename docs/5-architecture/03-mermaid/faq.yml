    qa:
      - id: how-to-write
        question:
          en: "Do I need Mermaid installed?"
          cn: "要自己装 Mermaid 吗?"
        answer:
          en: >
            No — you only write the syntax into `m=`. The service renders it and hands back an SVG, so there is no browser and no screenshot step.
          cn: >
            不用 —— 你只把语法写进 `m=`。服务端渲染好直接给你 SVG,没有浏览器、也没有截图这一步。
