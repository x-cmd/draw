id: x-ratelimit-13-data-formats

data:
  - name:
      en: data formats
      cn: 数据格式
    qa:
      - id: flat-vs-json-choose
        question:
          cn: "扁平参数 vs ?d= JSON——选哪种？"
          en: "Flat params vs ?d= JSON — which?"
        answer:
          cn: |
            两种写法结果完全一样，按场景选：

            - **≤ 5 项、无嵌套** → 扁平参数。URL 短、可分享
            - **> 5 项或嵌套** → `?d=` JSON。整洁

            详细对比见 [13-data-formats](13-data-formats) §四。
          en: |
            Both formats produce identical output — pick by situation:

            - **≤ 5 items, no nesting** → flat params. URL short, shareable
            - **> 5 items or nested** → `?d=` JSON. Cleaner

            Full comparison in [13-data-formats](13-data-formats) §4.
        confidence: 10
        reference:
          - docs/4-data-formats/cn.md
          - docs/4-data-formats/en.md

      - id: json-url-encode
        question:
          cn: "?d= JSON 怎么 URL-encode？"
          en: "How to URL-encode ?d= JSON?"
        answer:
          cn: |
            `&d={"..."}` 在 URL 里 `&` 会切分参数。必须用 URL-encode：

            - `{` → `%7B`
            - `}` → `%7D`
            - `"` → `%22`
            - 空格 → `%20` 或 `+`
            - 换行 → `%0A`（用于 vCard）

            例：
            ```
            /draw?type=pie&d=%7B%22title%22:%22Chrome%22,%22data%22:[%7B%22label%22:%22Chrome%22,%22value%22:65%7D]%7D
            ```

            编程时用 `encodeURIComponent()` 或 URL 库。
          en: |
            `&d={"..."}` in URL — `&` would split the param. Must URL-encode:

            - `{` → `%7B`
            - `}` → `%7D`
            - `"` → `%22`
            - space → `%20` or `+`
            - newline → `%0A` (for vCard)

            Example:
            ```
            /draw?type=pie&d=%7B%22title%22:%22Chrome%22,%22data%22:[%7B%22label%22:%22Chrome%22,%22value%22:65%7D]%7D
            ```

            Programmatic generation: use `encodeURIComponent()` or a URL library.
        confidence: 10
        reference:
          - docs/4-data-formats/cn.md

      - id: json-schema-per-chart
        question:
          cn: "JSON 格式的 schema 是什么样？"
          en: "What's the JSON schema for each chart type?"
        answer:
          cn: |
            每种图表有自己的 JSON schema。常用：

            **饼图 / 水平柱 / 仪表盘 / 桑基图：**
            ```json
            {"title": "...", "data": [{"label": "...", "value": ...}]}
            ```

            **柱 / 折线 / 面积 / 雷达：**
            ```json
            {"title": "...", "labels": [...], "series": {"A": [...], "B": [...]}}
            ```

            **散点图：**
            ```json
            {"title": "...", "xlabel": "...", "ylabel": "...", "data": [{"x": ..., "y": ...}]}
            ```

            完整 schema 见 [13-data-formats](13-data-formats) §三。
          en: |
            Each chart has its own JSON schema. Common ones:

            **pie / hbar / gauge / sankey:**
            ```json
            {"title": "...", "data": [{"label": "...", "value": ...}]}
            ```

            **bar / line / area / radar:**
            ```json
            {"title": "...", "labels": [...], "series": {"A": [...], "B": [...]}}
            ```

            **scatter:**
            ```json
            {"title": "...", "xlabel": "...", "ylabel": "...", "data": [{"x": ..., "y": ...}]}
            ```

            Full schema in [13-data-formats](13-data-formats) §3.
        confidence: 9
        reference:
          - docs/4-data-formats/cn.md

      - id: mix-formats-warning
        question:
          cn: "扁平参数和 JSON 能混着用吗？"
          en: "Can I mix flat params and JSON in one URL?"
        answer:
          cn: |
            技术上可以（不同参数独立解析），但**强烈不建议**：

            - 阅读 URL 时容易搞混（"labels= 是扁平的，d= 是 JSON 的？"）
            - 测试时一改全乱
            - 同事 review URL 困惑

            选一种坚持用。
          en: |
            Technically yes (different params parse independently), but **strongly discouraged**:

            - Hard to read mixed URLs ("wait, is labels= flat or d= JSON?")
            - Testing breaks everything
            - Confusing for teammates reviewing URLs

            Pick one and stick with it.
        confidence: 9
        reference:
          - docs/4-data-formats/cn.md