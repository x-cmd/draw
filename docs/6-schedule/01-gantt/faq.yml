id: x-draw-6-schedule-01-gantt

data:
  - name:
      en: Gantt chart
      cn: 甘特图
    qa:
      - id: how-to-write
        question:
          en: "How is the schedule written?"
          cn: "排期怎么写?"
        answer:
          en: >
            As text: `dateFormat YYYY-MM-DD`, then `section Dev` and one line per task — `Design :done, a1, 2026-11-01, 3d`. A task can start `after` another task's id.
          cn: >
            用文本写:`dateFormat YYYY-MM-DD`,然后 `section Dev`,一行一个任务 —— `Design :done, a1, 2026-11-01, 3d`。任务可以 `after` 另一个任务的 id 开始。
        confidence: 9
        reference:
          - docs/6-schedule/01-gantt/en.md
          - docs/6-schedule/01-gantt/cn.md
  - name:
      en: Encoding
      cn: 编码
    qa:
      - id: encoding
        question:
          en: "Does the source need escaping?"
          cn: "源码要转义吗?"
        answer:
          en: >
            Yes — it goes into `m=` URL-encoded: newlines become `%0A` and spaces `%20`. A raw `&` or `,` inside a task name breaks the parse.
          cn: >
            要 —— 源码要 URL 编码后放进 `m=`:换行变 `%0A`、空格变 `%20`。任务名里没编码的 `&` 或 `,` 会让解析断掉。
        confidence: 9
        reference:
          - docs/6-schedule/01-gantt/en.md
          - docs/6-schedule/01-gantt/cn.md
