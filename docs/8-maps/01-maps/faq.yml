id: x-draw-8-maps-01-maps

data:
  - name:
      en: Map
      cn: 地图
    qa:
      - id: which-regions
        question:
          en: "Which maps are available?"
          cn: "有哪些地图?"
        answer:
          en: >
            USA (50 states + DC), CN (provinces), EU (27 countries), JP (47 prefectures), BR, AU, DE, KR. The GeoJSON ships with the service, so `series.map` just names the region.
          cn: >
            美国(50 州 + DC)、中国(各省市)、欧盟(27 国)、日本(47 都道府县)、巴西、澳大利亚、德国、韩国。GeoJSON 随服务分发,`series.map` 直接写区域名就行。
        confidence: 9
        reference:
          - docs/8-maps/01-maps/en.md
          - docs/8-maps/01-maps/cn.md
  - name:
      en: Region names
      cn: 地名写法
    qa:
      - id: names
        question:
          en: "What are the region names written in?"
          cn: "地名要用什么写法?"
        answer:
          en: >
            Whatever the GeoJSON uses: English for the US and the EU, Chinese short forms for China (`北京`), German for Germany (`Hamburg`), Portuguese for Brazil.
          cn: >
            跟着 GeoJSON 走:美国和欧盟用英文,中国用简称(`北京`),德国用德语(`Hamburg`),巴西用葡萄牙语。
        confidence: 9
        reference:
          - docs/8-maps/01-maps/en.md
          - docs/8-maps/01-maps/cn.md
