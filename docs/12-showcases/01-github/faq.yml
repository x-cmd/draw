id: x-draw-12-showcases-01-github

data:
  - name:
      en: GitHub showcase
      cn: GitHub 场景
    qa:
      - id: which-chart
        question:
          en: "Share or count — which one should I use?"
          cn: "占比还是数量,该用哪个?"
        answer:
          en: >
            Share, use the donut: it answers “how is the total split” at a glance. Count, use the horizontal bar: the numbers stay readable and long language names do not get cut.
          cn: >
            看占比用环形图,一眼就知道总量怎么分;看数量用横条图,数字读得准,长名字也不会被截断。
        confidence: 9
        reference:
          - docs/12-showcases/01-github/en.md
          - docs/12-showcases/01-github/cn.md
