id: x-draw-12-showcases-03-macro-economics

data:
  - name:
      en: Macro showcase
      cn: 宏观场景
    qa:
      - id: which-chart
        question:
          en: "Trade flows — why not a pie chart?"
          cn: "贸易流向为什么不用饼图?"
        answer:
          en: >
            A pie shows shares of one whole. Trade is not one whole — it is several sources feeding several destinations, so the Sankey keeps both ends of every flow visible.
          cn: >
            饼图画的是「一个整体的份额」。贸易不是一个整体,是几个来源流向几个去处,桑基图能把每条流的两头都留住。
        confidence: 9
        reference:
          - docs/12-showcases/03-macro-economics/en.md
          - docs/12-showcases/03-macro-economics/cn.md
