id: x-ratelimit-2-overview

data:
  - name:
      en: overview
      cn: 总览
    qa:
      - id: draw-endpoint-what
        question:
          cn: "x-cmd/draw 是什么？怎么用？"
          en: "What is x-cmd/draw and how to use it?"
        answer:
          cn: |
            `x-cmd/draw` 是单端点 SVG 图表服务。`GET /draw?type=<chart>&...` 直接返 SVG（纯文本，可 grep / diff）。

            ```sh
            curl "https://x-cmd.com/draw?type=pie&labels=A,B,C&values=10,20,30"
            ```

            详细：[2-overview](2-overview) §六。
          en: |
            `x-cmd/draw` is a single-endpoint SVG chart service. `GET /draw?type=<chart>&...` returns SVG (pure text, grep/diff-friendly).

            ```sh
            curl "https://x-cmd.com/draw?type=pie&labels=A,B,C&values=10,20,30"
            ```

            Detail: [2-overview](2-overview) §6.
        confidence: 10
        reference:
          - docs/2-overview/zh.md
          - docs/2-overview/en.md

      - id: draw-supported-chart-types
        question:
          cn: "x-cmd/draw 支持哪些图表？"
          en: "What chart types does x-cmd/draw support?"
        answer:
          cn: |
            11 种：`pie` / `bar` / `hbar` / `line` / `area` / `radar` / `gauge` / `scatter` / `combo` / `sankey` / `qr`（二维码）。

            每种图表的具体用法见各自专门文章：
            [10-pie](10-pie) / [11-bar](11-bar) / [12-hbar](12-hbar) / [13-line](13-line) / [14-area](14-area) / [15-radar](15-radar) / [16-gauge](16-gauge) / [17-scatter](17-scatter) / [18-combo](18-combo) / [19-sankey](19-sankey) / [20-qr](20-qr)。
          en: |
            11 types: `pie` / `bar` / `hbar` / `line` / `area` / `radar` / `gauge` / `scatter` / `combo` / `sankey` / `qr` (QR code).

            Each chart's specifics in its dedicated article:
            [10-pie](10-pie) / [11-bar](11-bar) / [12-hbar](12-hbar) / [13-line](13-line) / [14-area](14-area) / [15-radar](15-radar) / [16-gauge](16-gauge) / [17-scatter](17-scatter) / [18-combo](18-combo) / [19-sankey](19-sankey) / [20-qr](20-qr).
        confidence: 10
        reference:
          - docs/2-overview/zh.md

      - id: draw-common-params
        question:
          cn: "x-cmd/draw 通用参数有哪些？"
          en: "What are x-cmd/draw's common parameters?"
        answer:
          cn: |
            所有图表共享的参数：

            - `t=` 风格 / 主题（如 `evil`、`market-mono`、`progress`、`revenue`）
            - `scheme=dark\|light` 配色方案，默认跟随系统
            - `num=all\|peak\|none` 数值标签密度
            - `v=1` 冻结响应（缓存 / 调试用）
            - `w=` / `h=` SVG 宽高
            - `title=` 标题
            - `unit=` 数值单位（如 `B`、`responses`、`%`）

            每个图表自己的参数见各自专门文章。完整风格清单见 [3-styles-themes](3-styles-themes)。
          en: |
            Params shared by all charts:

            - `t=` style / theme (e.g., `evil`, `market-mono`, `progress`, `revenue`)
            - `scheme=dark\|light` color scheme, default follows system
            - `num=all\|peak\|none` numeric label density
            - `v=1` freeze response (for cache / debug)
            - `w=` / `h=` SVG width / height
            - `title=` chart title
            - `unit=` numeric unit (e.g., `B`, `responses`, `%`)

            Each chart's own params in its dedicated article. Full style catalog in [3-styles-themes](3-styles-themes).
        confidence: 10
        reference:
          - docs/2-overview/zh.md

      - id: draw-data-format-choice
        question:
          cn: "扁平参数 vs JSON（?d=）—— 选哪种？"
          en: "Flat params vs JSON (?d=) — which to use?"
        answer:
          cn: |
            两种写法**结果完全一样**，按场景选：

            - **数据少（≤ 5 项）→ 扁平参数**。URL 短、可分享、便于 `git diff`
            - **数据多 / 有结构 → `?d=` JSON**。URL 仍可读，但避免参数爆炸

            详细对比、边界情况见 [5-data-formats](5-data-formats)。
          en: |
            Both formats produce **identical output** — pick by situation:

            - **Small data (≤ 5 items) → flat params**. URL short, shareable, `git diff`-friendly
            - **Big data / structured → `?d=` JSON**. URL still readable, avoids parameter explosion

            Full comparison, edge cases in [5-data-formats](5-data-formats).
        confidence: 9
        reference:
          - docs/2-overview/zh.md
          - docs/5-data-formats/zh.md

      - id: draw-get-vs-post
        question:
          cn: "GET /draw 和 POST /draw 区别？"
          en: "GET /draw vs POST /draw — what's the difference?"
        answer:
          cn: |
            - `GET /draw?...` —— 一次性 SVG，返回 `image/svg+xml`
            - `POST /draw?...` —— 创建**永久短链**，返回 `{ "id": "...", "url": "/d/abc123" }`

            POST 适合：
            - 文档嵌入的稳定图表（URL 不变）
            - README badge / issue comment
            - 长期分享（短链不跟 query 参数走）
          en: |
            - `GET /draw?...` — one-shot SVG, returns `image/svg+xml`
            - `POST /draw?...` — creates a **permanent short URL**, returns `{ "id": "...", "url": "/d/abc123" }`

            POST use cases:
            - Charts embedded in docs (stable URL)
            - README badges / issue comments
            - Long-term sharing (short URL doesn't carry query params)
        confidence: 9
        reference:
          - docs/2-overview/zh.md

      - id: draw-svg-text-format
        question:
          cn: "x-cmd/draw 返回的 SVG 是图片还是文本？"
          en: "Is the SVG returned by x-cmd/draw an image or text?"
        answer:
          cn: |
            **纯文本**。每个 SVG 内嵌 `<metadata>` 节点（title / desc / source URL）：

            ```xml
            <svg viewBox="0 0 600 400" xmlns="...">
              <metadata>
                <title>Chrome holds the browser market</title>
                <desc>Generated by x-cmd/draw</desc>
                <source>/draw?type=pie&amp;labels=Chrome,Safari,Firefox</source>
              </metadata>
              <!-- 实际图形 -->
            </svg>
            ```

            好处：`grep "<text>"` 找所有标签，`git diff` 看图表变化，直接 paste 到 issue / Slack。
          en: |
            **Pure text**. Every SVG embeds a `<metadata>` node (title / desc / source URL):

            ```xml
            <svg viewBox="0 0 600 400" xmlns="...">
              <metadata>
                <title>Chrome holds the browser market</title>
                <desc>Generated by x-cmd/draw</desc>
                <source>/draw?type=pie&amp;labels=Chrome,Safari,Firefox</source>
              </metadata>
              <!-- actual graphic -->
            </svg>
            ```

            Benefit: `grep "<text>"` finds all labels, `git diff` shows chart changes, paste directly into issues / Slack.
        confidence: 10
        reference:
          - docs/2-overview/zh.md