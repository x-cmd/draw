id: x-draw-2-chart-types-04-architecture-02-mindmap

data:
  - name:
      en: Mind map
      cn: 思维导图
    qa:
      - id: how-to-write
        question:
          en: "How do I write the tree?"
          cn: "树怎么写?"
        answer:
          en: >
            One `n=` per leaf, slash-separated: `Launch/Eng/Tests`. Paths that share a prefix share a parent — the parents are inferred, you never write them.
          cn: >
            每个叶子一条 `n=`,用斜杠分层:`Launch/Eng/Tests`。有公共前缀的路径就是同一个父节点,父节点由引擎推断,不用你写。
        confidence: 9
        reference:
          - docs/2-chart-types/04-architecture/02-mindmap/en.md
          - docs/2-chart-types/04-architecture/02-mindmap/cn.md
