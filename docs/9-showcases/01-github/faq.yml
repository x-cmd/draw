      - id: not-stars
        question:
          en: "Why no chart of stars or commits?"
          cn: "为什么没有 star 数、提交数那种图?"
        answer:
          en: >
            Because nobody reads them. The pictures that earn their place on an issue, a PR or a release are the ones that show the thing itself: what it does, what changed, what the code looks like now.
