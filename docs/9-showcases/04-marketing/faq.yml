id: x-draw-9-showcases-04-marketing

data:
  - name:
      en: Marketing showcase
      cn: 营销场景
    qa:
      - id: which-chart
        question:
          en: "Funnel or chart for channels?"
          cn: "漏斗和渠道图,该用哪个?"
        answer:
          en: >
            The Sankey when the channels feed each other (ads, web, newsletter into signups, then purchases). The bar chart when you just compare channels side by side, this year against last.
          cn: >
            渠道之间有进有出时用桑基图(广告、站内、邮件汇入注册,再流向付费);只是要横向比一比渠道、或者比今年和去年,用条形图。
        confidence: 9
        reference:
          - docs/9-showcases/04-marketing/en.md
          - docs/9-showcases/04-marketing/cn.md
