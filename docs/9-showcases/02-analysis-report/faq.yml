data:
  - name:
      en: Analysis report
      cn: 分析报告
    qa:
      - id: which-chart
        question:
          en: "How do I put a count and a percentage on one chart?"
          cn: "数量和百分比怎么放同一张图?"
        answer:
          en: >
            Use the combo chart: columns for the count, a line for the rate. The line rides on a second y-axis, so the two scales never have to agree.
          cn: >
            用混合图:数量走柱子,比率走折线。折线挂在第二根纵轴上,两个量程不必强行对齐。
        confidence: 9
