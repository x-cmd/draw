# .github/workflows/publish.yml

name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v6
      # jsr CLI 以 BYONM 模式跑 deno publish,模块图里的 d3/uqr 需先装进 node_modules
      - run: npm ci --omit=dev
      - run: npx jsr publish
