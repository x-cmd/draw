# .github/workflows/publish.yml — 推 main 即发布:npm + JSR(版本已存在则各自跳过)

name: Publish

on:
  push:
    branches:
      - main

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Publish to npm (skip if version already there)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@x-cmd/draw@$V" version >/dev/null 2>&1; then
            echo "@x-cmd/draw@$V already on npm, skipping"
          else
            npm publish --access public
          fi

  jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # deno publish 解析 package.json 裸依赖(d3/uqr)需要 node_modules
      - run: npm ci --omit=dev
      - name: Publish to JSR (skip if version already there)
        run: |
          V=$(node -p "require('./package.json').version")
          if curl -fsS "https://api.jsr.io/@x-cmd/draw/$V/meta" >/dev/null 2>&1; then
            echo "@x-cmd/draw@$V already on JSR, skipping"
          else
            deno publish --unstable-sloppy-imports
          fi
