# .github/workflows/publish.yml — 推 main 即发布:npm(OIDC trusted publishing,无 token)+ JSR
# npm 侧需在 npmjs.com 包 Settings → Trusted Publisher 登记:
#   repository=x-cmd/draw · workflow=publish.yml · environment 留空

name: Publish

on:
  push:
    branches:
      - main

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC:trusted publishing 与 provenance
    steps:
      - uses: actions/checkout@v6
      # node 24 自带 npm ≥ 11.5(trusted publishing 最低版本)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Publish to npm (skip if version already there)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@x-cmd/draw@$V" version >/dev/null 2>&1; then
            echo "@x-cmd/draw@$V already on npm, skipping"
          else
            npm publish --access public --provenance
          fi

  jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # The OIDC ID token is used for authentication with JSR.
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # deno publish 解析 package.json 裸依赖(d3/uqr)需要 node_modules
      - run: npm ci --omit=dev
      - name: Publish to JSR (skip if version already there)
        # JSR 服务端发布队列偶发卡住(too many requests),限时+容错,下推自动重试
        timeout-minutes: 5
        continue-on-error: true
        run: |
          V=$(node -p "require('./package.json').version")
          if curl -fsS "https://jsr.io/@x-cmd/draw/${V}_meta.json" >/dev/null 2>&1; then
            echo "@x-cmd/draw@$V already on JSR, skipping"
          else
            deno publish --unstable-sloppy-imports
          fi
